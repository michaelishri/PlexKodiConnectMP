name: Publish Kodi repository

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build repository files
        run: python3 scripts/build_repo.py --output build/pages

      - name: Verify generated catalogue
        run: |
          python3 - <<'PY'
          import hashlib, os, xml.etree.ElementTree as ET
          base = 'build/pages/repo'
          ET.parse(os.path.join(base, 'addons.xml'))
          with open(os.path.join(base, 'addons.xml'), 'rb') as f:
              expected = hashlib.md5(f.read()).hexdigest()
          with open(os.path.join(base, 'addons.xml.md5')) as f:
              actual = f.read().strip()
          assert expected == actual, (expected, actual)
          print('addons.xml valid, md5', actual)
          PY

      - name: Deploy catalogue to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/pages
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Publish release with installer ZIP
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/pages/repository.plexkodiconnect.ms-*.zip \
            build/pages/repo/bin/*/*.zip \
            --target "${GITHUB_SHA}" \
            --title "PlexKodiConnect Multi-Server ${GITHUB_REF_NAME}" \
            --generate-notes
